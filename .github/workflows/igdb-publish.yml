name: IGDB catalogue import
on:
  workflow_dispatch:
    inputs:
      permission_confirmed:
        description: Confirm IGDB publication permission and approve database import
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  import:
    if: inputs.permission_confirmed
    runs-on: ubuntu-latest
    concurrency:
      group: igdb-catalogue-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/igdb-sync.mjs
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      - run: node scripts/igdb-publish.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
